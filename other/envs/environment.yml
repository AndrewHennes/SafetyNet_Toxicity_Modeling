name: safetynet
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Core
  - python=3.10
  - pip

  # Numerics / ML
  - numpy=1.26
  - pandas=2.2
  - scipy=1.11
  - scikit-learn=1.7

  # PyTorch stack (GPU-capable builds; CUDA handled by PyTorch channel / your system)
  - pytorch=2.5
  - torchvision=0.20
  - torchaudio=2.5

  # Cheminformatics / plotting
  - rdkit
  - matplotlib=3.9
  - seaborn=0.13

  # Misc
  - numba
  - umap-learn
  - tqdm
  - pyyaml
  - requests